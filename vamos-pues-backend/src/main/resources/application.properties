spring.application.name=VamosPues

# Base de datos H2 embebida: se guarda en el archivo ./data/vamospues.mv.db (dentro de la
# carpeta del backend), así que no hace falta instalar ningún motor de base de datos.
# Las tablas se crean solas y la primera vez se cargan los 129 lugares oficiales.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vamospues;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Puerto del servidor. La mayoria de hostings (Render, Railway, etc.) asignan el puerto
# ellos mismos por la variable de entorno PORT; en este equipo usa 8086.
server.port=${PORT:8086}

# Nunca mandar el stack trace en la respuesta JSON de un error (fuga de información).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never


# Origenes permitidos por CORS, separados por coma.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Clave de acceso al panel de administración (cambiarla con la variable ADMIN_CLAVE).
admin.clave=${ADMIN_CLAVE:vamospues2026}

# Secreto para firmar los tokens JWT (HS256, minimo 32 caracteres) y su duracion (8 horas).
# El valor por defecto es solo para desarrollo local: en produccion definir JWT_SECRET.
jwt.secret=${JWT_SECRET:vamos-pues-desarrollo-local-cambiar-en-produccion-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
